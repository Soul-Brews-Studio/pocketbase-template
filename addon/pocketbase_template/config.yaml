name: PocketBase Template
version: "0.1.0"
slug: pocketbase_template
description: PocketBase backend with provisioned logins and owner-only example data
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
# Sidebar panel through ingress: the landing page (pocketbase/pb_public) signs a Home Assistant
# user in to the dashboard (auto_login) and opens it; every URL is relative, so it works under
# the ingress prefix. The port stays published for apps and devices that use the API.
ingress: true
ingress_port: 8090
panel_icon: mdi:database
panel_title: PocketBase Template
watchdog: http://[HOST]:[PORT:8090]/api/health
# The panel's "Apply migrations" asks the Supervisor to restart this add-on (/addons/self/restart).
hassio_api: true
# A Home Assistant notification when a newer app UI release is out (pb_hooks/lib/uiupdate.js).
homeassistant_api: true
# Drop-in migrations and hooks: /addon_configs/<this add-on>/pb_migrations, …/pb_hooks on the host
# (Samba or File editor add-on) = /config here; merged on every start (scripts/merge-extra.sh).
map:
  - addon_config:rw
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: PocketBase API, realtime and admin UI (/_/)
webui: http://[HOST]:[PORT:8090]/_/
# pb_data and the generated credentials live in /data (persistent, included in backups).
backup: hot
options:
  admin_email: admin@example.invalid
  app_email: app@example.invalid
  auto_login: true
  ha_user_ids: ""
  ui_repo: ""
  ui_version: latest
schema:
  admin_email: email
  app_email: email
  public_url: url?
  # Signed in to Home Assistant -> signed in to the dashboard as admin_email, from the sidebar
  # panel only (trusted only from Supervisor's ingress proxy, never through the published port).
  auto_login: bool
  # Optional: comma-separated Home Assistant user ids allowed to auto-login (empty: the first
  # user to open the panel claims it).
  ha_user_ids: str?
  # The app UI served at "/": owner/repo whose releases carry dist.zip (empty: this repository).
  ui_repo: str?
  # latest | a release tag (ui-v0.1.0) | a full dist.zip URL | bundled (no app UI)
  ui_version: str?
